apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: affine-postgres-pvc
  namespace: affine
  labels:
    app: affine
    component: postgres
  annotations:
    "helm.sh/resource-policy": keep
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: nfs-client-re # Explicitly set to your NFS storage class

