apiVersion: apps/v1
kind: Deployment
metadata:
  name: affine-redis
  namespace: affine
  labels:
    app: affine
    component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: affine
      component: redis
  template:
    metadata:
      labels:
        app: affine
        component: redis
    spec:
      imagePullSecrets:
        - name: harbor-registry-secret
      nodeSelector:
        kubernetes.io/os: linux
      containers:
        - name: redis
          image: redis:latest
          ports:
            - containerPort: 6379
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: affine-redis
  namespace: affine
  labels:
    app: affine
    component: redis
spec:
  ports:
    - port: 6379
      targetPort: 6379
  selector:
    app: affine
    component: redis
