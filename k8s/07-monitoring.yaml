apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: affine
  labels:
    app: affine
    component: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      # Assuming AFFiNE exposes metrics at /metrics
      - job_name: 'affine'
        metrics_path: /metrics
        static_configs:
          - targets: ['affine:3010']
        relabel_configs:
          - source_labels: [__address__]
            target_label: instance
            replacement: 'affine-server'

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: affine-prometheus
  namespace: affine
  labels:
    app: affine
    component: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: affine
      component: monitoring
  template:
    metadata:
      labels:
        app: affine
        component: monitoring
    spec:
      imagePullSecrets:
        - name: harbor-registry-secret
      nodeSelector:
        kubernetes.io/os: linux
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus/
            - name: prometheus-storage
              mountPath: /prometheus
      volumes:
        - name: prometheus-config
          configMap:
            name: prometheus-config
        - name: prometheus-storage
          emptyDir: {} # Use PersistentVolumeClaim for production persistence

---
apiVersion: v1
kind: Service
metadata:
  name: affine-prometheus
  namespace: affine
  labels:
    app: affine
    component: monitoring
spec:
  type: NodePort # Expose for external access if needed, or use Ingress
  ports:
    - port: 9090
      targetPort: 9090
      nodePort: 30090 # Optional: fixed node port
  selector:
    app: affine
    component: monitoring
